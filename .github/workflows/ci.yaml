name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Compact 0.31.1
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Set up Bun 1.3.11
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          (cd webapp && bun install --frozen-lockfile)

      - name: Compile the Compact contracts
        run: |
          npm run compact
          npm run compact:advanced

      - name: Verify generated key manifest
        run: |
          bun run keys:verify
          bun run keys:verify:advanced

      - name: Run contract and crypto tests
        run: |
          npm test
          npm run test:advanced

      - name: Run browser-module tests
        run: npm run test:webapp

      - name: Typecheck root and browser projects
        run: |
          npm run typecheck
          npm run typecheck:advanced
          npm run typecheck:webapp

      - name: Build browser application
        run: npm run build:webapp
